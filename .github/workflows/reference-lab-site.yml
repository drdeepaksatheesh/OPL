name: Reference Lab site

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/prepare_ecgid_reference.py"
      - "scripts/verify_ecgid_reference.py"
      - "scripts/build_reference_site.py"
      - ".github/workflows/reference-lab-site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/prepare_ecgid_reference.py"
      - "scripts/verify_ecgid_reference.py"
      - "scripts/build_reference_site.py"
      - ".github/workflows/reference-lab-site.yml"
  workflow_dispatch:

concurrency:
  group: reference-lab-site-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-reference-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install reference-build dependencies
        run: python -m pip install --upgrade "wfdb>=4.1,<5" "Pillow>=10,<12"

      - name: Fetch frozen ECG-ID reference record
        run: python scripts/prepare_ecgid_reference.py --person Person_01 --record rec_1

      - name: Verify source-derived reference package
        run: python scripts/verify_ecgid_reference.py

      - name: Run Reference Lab calculation and teaching tests
        run: node --test site/tests/reference-lab-core.test.mjs site/tests/teaching.test.mjs

      - name: Build offline-capable static site
        run: python scripts/build_reference_site.py

      - name: Confirm key build outputs
        run: |
          test -f build/opl-site/reference/ecg-id/data/Person_01_rec_1.json
          test -f build/opl-site/icons/icon-192.png
          test -f build/opl-site/icons/icon-512.png
          test -f build/opl-reference-lab-static.zip

      - name: Upload downloadable Reference Lab build
        uses: actions/upload-artifact@v4
        with:
          name: opl-reference-lab-static
          path: |
            build/opl-site
            build/opl-reference-lab-static.zip
          if-no-files-found: error
          retention-days: 30


  windows-launcher-smoke:
    runs-on: windows-latest
    needs: build-reference-lab
    timeout-minutes: 5
    steps:
      - name: Download the exact built Reference Lab artifact
        uses: actions/download-artifact@v4
        with:
          name: opl-reference-lab-static
          path: artifact

      - name: Start Windows-native OPL server and smoke-test
        shell: powershell
        run: |
          $site = Resolve-Path 'artifact/opl-site'
          $serverScript = Join-Path $site 'local_server.ps1'

          $server = Start-Process powershell.exe -ArgumentList @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', $serverScript,
            '-StartPort', '8765',
            '-NoBrowser'
          ) -PassThru -WindowStyle Hidden

          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/reference/ecg-id/index.html' -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match 'ECG Reference Lab') {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }

            if (-not $ready) {
              throw 'Windows OPL local server did not become ready.'
            }

            $record = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/reference/ecg-id/data/Person_01_rec_1.json' -TimeoutSec 5
            if ($record.StatusCode -ne 200) {
              throw 'Reference record was not served.'
            }
            $json = $record.Content | ConvertFrom-Json
            if ($json.sample_count -ne 10000 -or $json.sampling_rate_hz -ne 500) {
              throw 'Served reference record did not preserve expected source metadata.'
            }

            if (-not (Test-Path (Join-Path $site 'START_OPL_REFERENCE_LAB.cmd'))) {
              throw 'One-click Windows launcher missing from built artifact.'
            }
            if (-not (Test-Path (Join-Path $site 'START_OPL_PHONE_TEST.cmd'))) {
              throw 'Phone-test launcher missing from built artifact.'
            }

            Write-Host 'Windows local-only launcher/server smoke test passed.'
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

          $lanServer = Start-Process powershell.exe -ArgumentList @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', $serverScript,
            '-StartPort', '8766',
            '-NoBrowser',
            '-AllowLan'
          ) -PassThru -WindowStyle Hidden

          try {
            $lanReady = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $lanResponse = Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8766/reference/ecg-id/index.html' -TimeoutSec 2
                if ($lanResponse.StatusCode -eq 200 -and $lanResponse.Content -match 'ECG Reference Lab') {
                  $lanReady = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $lanReady) {
              throw 'Windows LAN-capable OPL server did not become ready.'
            }
            Write-Host 'Windows LAN-capable phone-test server smoke test passed.'
          }
          finally {
            if ($lanServer -and -not $lanServer.HasExited) {
              Stop-Process -Id $lanServer.Id -Force
            }
          }


  responsive-browser-smoke:
    runs-on: ubuntu-latest
    needs: build-reference-lab
    timeout-minutes: 10
    steps:
      - name: Download the exact built Reference Lab artifact
        uses: actions/download-artifact@v4
        with:
          name: opl-reference-lab-static
          path: artifact

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright test runtime
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory artifact/opl-site > /tmp/opl-http.log 2>&1 &
          echo $! > /tmp/opl-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/reference/ecg-id/index.html >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/opl-http.log
          exit 1

      - name: Test phone Teaching mode and desktop Advanced mode
        env:
          OPL_TEST_URL: http://127.0.0.1:8765
          OPL_SCREENSHOT_DIR: build/browser-smoke
        run: node artifact/opl-site/tests/browser-smoke.mjs

      - name: Upload responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: opl-responsive-smoke-screenshots
          path: build/browser-smoke
          if-no-files-found: error
          retention-days: 30


  classroom-loop-smoke:
    runs-on: windows-latest
    needs: build-reference-lab
    timeout-minutes: 8
    steps:
      - name: Download exact built OPL artifact
        uses: actions/download-artifact@v4
        with:
          name: opl-reference-lab-static
          path: artifact

      - name: Start classroom server and simulate teacher/student loop
        shell: powershell
        run: |
          $site = Resolve-Path 'artifact/opl-site'
          $serverScript = Join-Path $site 'classroom_server.ps1'
          $stdout = Join-Path $env:RUNNER_TEMP 'opl-classroom.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'opl-classroom.err'

          $server = Start-Process powershell.exe -ArgumentList @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', $serverScript,
            '-StartPort', '8780',
            '-NoBrowser'
          ) -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
            $teacherUrl = $null
            $joinCode = $null
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $stdout) {
                $text = Get-Content $stdout -Raw
                if (-not [string]::IsNullOrWhiteSpace($text)) {
                  $teacherMatch = [regex]::Match($text, 'Teacher dashboard:\s+(http://[^\r\n]+)')
                  $codeMatch = [regex]::Match($text, 'Join code:\s+(\d{6})')
                  if ($teacherMatch.Success) { $teacherUrl = $teacherMatch.Groups[1].Value.Trim() }
                  if ($codeMatch.Success) { $joinCode = $codeMatch.Groups[1].Value.Trim() }
                  if ($teacherUrl -and $joinCode) { break }
                }
              }
              if ($server.HasExited) {
                if (Test-Path $stderr) { Get-Content $stderr }
                throw 'Classroom server exited before becoming ready.'
              }
            }

            if (-not $teacherUrl -or -not $joinCode) {
              Get-Content $stdout
              if (Test-Path $stderr) { Get-Content $stderr }
              throw 'Could not parse classroom teacher URL / join code.'
            }

            $tokenMatch = [regex]::Match($teacherUrl, '[?&]teacher=([^&]+)')
            if (-not $tokenMatch.Success) { throw 'Teacher token missing from dashboard URL.' }
            $teacherToken = [System.Uri]::UnescapeDataString($tokenMatch.Groups[1].Value)
            $base = 'http://127.0.0.1:8780'
            $teacherHeaders = @{'X-OPL-Teacher-Token'=$teacherToken}

            $teacherPage = Invoke-WebRequest -UseBasicParsing ($base + '/classroom/teacher.html') -TimeoutSec 5
            if ($teacherPage.StatusCode -ne 200 -or $teacherPage.Content -notmatch 'OPL Classroom') {
              throw 'Teacher page failed to load.'
            }

            $joinBody = @{join_code=$joinCode;label='CI Student'} | ConvertTo-Json -Compress
            $join = Invoke-RestMethod -Method Post -Uri ($base + '/classroom/api/join') -ContentType 'application/json' -Body $joinBody
            $participantId = $join.participant_id
            if (-not $participantId) { throw 'Student join did not return participant id.' }

            $preBody = @{
              participant_id=$participantId
              type='pretest_completed'
              client_time=[DateTime]::UtcNow.ToString('o')
              section_id=$null
              payload=@{
                questionnaire_id='ecg-reference-classroom-v0.1'
                responses=@{
                  pre_sample_time=2
                  pre_source_filtered=1
                  pre_baseline=1
                }
              }
            } | ConvertTo-Json -Depth 10 -Compress
            Invoke-RestMethod -Method Post -Uri ($base + '/classroom/api/event') -ContentType 'application/json' -Body $preBody | Out-Null

            $section = @{
              id='baseline'
              title='Choose a baseline'
              prompt='CI teaching section'
              window_start_s=5
              window_length_s=5
              waveform='filtered'
            }
            $sectionBody = @{type='set_section';section=$section} | ConvertTo-Json -Depth 10 -Compress
            Invoke-RestMethod -Method Post -Uri ($base + '/classroom/api/teacher/action') -Headers $teacherHeaders -ContentType 'application/json' -Body $sectionBody | Out-Null

            $studentState = Invoke-RestMethod -Uri ($base + '/classroom/api/student/state?participant_id=' + $participantId)
            if ($studentState.state.phase -ne 'teach' -or $studentState.state.section.id -ne 'baseline') {
              throw 'Student did not receive teacher section state.'
            }

            $doubtBody = @{
              participant_id=$participantId
              type='doubt_submitted'
              client_time=[DateTime]::UtcNow.ToString('o')
              section_id='baseline'
              payload=@{text='Where exactly should I place the baseline?'}
            } | ConvertTo-Json -Depth 10 -Compress
            Invoke-RestMethod -Method Post -Uri ($base + '/classroom/api/event') -ContentType 'application/json' -Body $doubtBody | Out-Null

            $liveOpen = @{type='open_live_question';question_id='live_filtering'} | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri ($base + '/classroom/api/teacher/action') -Headers $teacherHeaders -ContentType 'application/json' -Body $liveOpen | Out-Null

            $liveBody = @{
              participant_id=$participantId
              type='live_response'
              client_time=[DateTime]::UtcNow.ToString('o')
              section_id='baseline'
              payload=@{question_id='live_filtering';answer=0}
            } | ConvertTo-Json -Depth 10 -Compress
            Invoke-RestMethod -Method Post -Uri ($base + '/classroom/api/event') -ContentType 'application/json' -Body $liveBody | Out-Null

            $postPhase = @{type='set_phase';phase='post'} | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri ($base + '/classroom/api/teacher/action') -Headers $teacherHeaders -ContentType 'application/json' -Body $postPhase | Out-Null

            $postBody = @{
              participant_id=$participantId
              type='posttest_completed'
              client_time=[DateTime]::UtcNow.ToString('o')
              section_id='baseline'
              payload=@{
                questionnaire_id='ecg-reference-classroom-v0.1'
                responses=@{
                  post_sample_time=1
                  post_source_filtered=0
                  post_baseline=1
                }
              }
            } | ConvertTo-Json -Depth 10 -Compress
            Invoke-RestMethod -Method Post -Uri ($base + '/classroom/api/event') -ContentType 'application/json' -Body $postBody | Out-Null

            $export = Invoke-RestMethod -Uri ($base + '/classroom/api/export') -Headers $teacherHeaders
            $types = @($export.events | ForEach-Object {$_.type})
            foreach ($required in @('participant_joined','pretest_completed','activity_changed','doubt_submitted','live_question_opened','live_response','posttest_completed')) {
              if ($types -notcontains $required) { throw ('Missing classroom event: ' + $required) }
            }
            if ($export.state.participants.Count -ne 1) { throw 'Unexpected participant count.' }
            if (-not $export.state.participants[0].pretest_completed -or -not $export.state.participants[0].posttest_completed) {
              throw 'Pre/post completion state was not preserved.'
            }

            Write-Host 'Teacher/student classroom loop smoke test passed.'
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

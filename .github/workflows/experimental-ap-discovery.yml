name: Screen authentic isolated action potentials (research)
on:
  push:
    branches: [feature/experimental-physiology-v0.1]
    paths:
      - '.github/workflows/experimental-ap-discovery.yml'
      - 'modules/experimental-physiology/scripts/screen_sgamp_isolated.py'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/experimental-ap-discovery.yml"
      - "modules/experimental-physiology/scripts/screen_sgamp_isolated.py"
permissions:
  contents: write
jobs:
  screen-physionet:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feature/experimental-physiology-v0.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific array tools
        run: python -m pip install numpy
      - name: Verify source checksums and screen a1 axon trials
        run: |
          python modules/experimental-physiology/scripts/screen_sgamp_isolated.py \
            --prefix a1 --limit 30 \
            --output modules/experimental-physiology/research/SGAMP_a1_screen.json
      - name: Publish reproducible research report (not endorsed waveform)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/experimental-physiology/research/SGAMP_a1_screen.json
          if ! git diff --cached --quiet; then
            git commit -m "research: publish checksum-verified trial screening results [skip ci]"
            git push origin HEAD:feature/experimental-physiology-v0.1
          fi
      - name: Store full screening report as a review artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgamp-a1-source-verified-screen
          path: modules/experimental-physiology/research/SGAMP_a1_screen.json
          if-no-files-found: error
          retention-days: 30

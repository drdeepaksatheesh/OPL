name: Reference ECG validation

on:
  push:
    branches:
      - publication-series
    paths:
      - "software/OpenPhysiologyLab/analysis/**"
      - "validation/reference_ecg/**"
      - ".github/workflows/reference-ecg-validation.yml"
  pull_request:
    paths:
      - "software/OpenPhysiologyLab/analysis/**"
      - "validation/reference_ecg/**"
      - ".github/workflows/reference-ecg-validation.yml"

concurrency:
  group: reference-ecg-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-scale-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy "wfdb>=4.1,<5"

      - name: Compile validation tools
        run: |
          python -m py_compile validation/reference_ecg/prepare_physionet_reference.py
          python -m py_compile validation/reference_ecg/validate_ptbxl_roundtrip.py
          python -m py_compile validation/reference_ecg/validate_mitbih_rpeaks.py

      - name: Run ECG scale-invariance regression
        run: |
          python -m unittest validation/reference_ecg/test_scale_invariance.py

      - name: Run PTB-XL physical-unit and timing round-trip benchmark
        run: |
          python validation/reference_ecg/validate_ptbxl_roundtrip.py

      - name: Upload PTB-XL validation report
        uses: actions/upload-artifact@v4
        with:
          name: opl-ptbxl-roundtrip-validation
          path: build/reference-validation/ptbxl_roundtrip_report.json
          if-no-files-found: error
          retention-days: 90

      - name: Run MIT-BIH frozen sentinel R-peak benchmark
        run: |
          python validation/reference_ecg/validate_mitbih_rpeaks.py --record-count 8

      - name: Upload MIT-BIH R-peak benchmark
        uses: actions/upload-artifact@v4
        with:
          name: opl-mitbih-rpeak-validation
          path: build/reference-validation/mitbih_rpeak_report.json
          if-no-files-found: error
          retention-days: 90
